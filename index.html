<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 3888424575-scale=1.0">
    <title>足球生涯模拟器 - 中国球员之路</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text2: #8b949e;
            --accent: #58a6ff;
            --gold: #d4a843;
            --green: #3fb950;
            --red: #f85149;
            --orange: #d2991d;
            --card: #1c2128;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px;
        }
        header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, #1a1f2b 0%, #0d1520 100%);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 1.6em;
            letter-spacing: 2px;
        }
        header h1 .icon {
            font-size: 1.4em;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin: 10px 0;
        }
        .panel h3 {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
            color: var(--accent);
            font-size: 1.1em;
        }
        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 700px) {
            .grid2,
            .grid3 {
                grid-template-columns: 1fr;
            }
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.9em;
        }
        .stat-bar-bg {
            flex: 1;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            margin: 0 8px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .stat-val {
            font-weight: bold;
            min-width: 28px;
            text-align: right;
            font-size: 0.85em;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--border);
            font-size: 0.9em;
            transition: all 0.2s;
            margin: 4px;
            text-align: center;
            background: #21262d;
            color: var(--text);
        }
        .btn:hover {
            border-color: var(--accent);
            background: #1f2a3a;
            transform: translateY(-1px);
        }
        .btn.primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }
        .btn.primary:hover {
            background: #388bfd;
        }
        .btn.gold {
            background: #5c3d0e;
            border-color: #d4a843;
            color: #ffd97a;
        }
        .btn.danger {
            background: #3d1115;
            border-color: #f85149;
            color: #ffa8a4;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 8px 0;
        }
        .highlight-box {
            background: #1a1f2b;
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 10px 0;
            font-style: italic;
            color: #c9d1d9;
        }
        .event-narrative {
            background: #0f1419;
            border: 1px solid #2a3040;
            border-radius: 10px;
            padding: 16px;
            margin: 10px 0;
            line-height: 1.8;
        }
        .event-narrative .date-tag {
            display: inline-block;
            background: #1f6feb33;
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78em;
            margin-right: 8px;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            margin: 2px;
        }
        .tag-up {
            background: #1b3d1b;
            color: #3fb950;
        }
        .tag-down {
            background: #3d1b1b;
            color: #f85149;
        }
        .tag-info {
            background: #1b2d3d;
            color: #58a6ff;
        }
        .tag-gold {
            background: #3d3018;
            color: #d4a843;
        }
        .ovr-circle {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            text-align: center;
            line-height: 54px;
            font-size: 1.4em;
            font-weight: bold;
            background: #0d1520;
            color: #fff;
            margin: 4px;
        }
        .value-tag {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd97a;
        }
        select {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            width: 100%;
            margin: 4px 0;
        }
        input {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            width: 100%;
            margin: 4px 0;
        }
        .career-log {
            max-height: 350px;
            overflow-y: auto;
            font-size: 0.85em;
            padding-right: 8px;
        }
        .career-log .entry {
            padding: 6px 0;
            border-bottom: 1px solid #1f2430;
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .club-badge {
            font-weight: bold;
            color: #ffd97a;
        }
        .transfer-rumor {
            background: #1c2128;
            border: 1px dashed #5c3d0e;
            border-radius: 8px;
            padding: 10px;
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="icon">⚽</span> 足球生涯模拟器</h1>
        <span style="font-size:0.8em;color:#8b949e;">中国球员之路 · 实时决策 · 从青训到传奇</span>
    </header>
    <div class="container" id="app"></div>

    <script>
        // ==================== 数据与状态管理 ====================
        const POSITIONS = ['ST', 'LW', 'RW', 'CAM', 'CM', 'CDM', 'LB', 'RB', 'CB', 'GK'];
        const CHINA_ACADEMIES = [
            { name: '山东泰山青训营', league: '中国青超联赛', tier: '顶级青训', desc: '中国最成功的青训体系之一，培养出众多国脚。设施一流，竞争激烈。' },
            { name: '根宝基地（上海）', league: '中国青超联赛', tier: '传奇青训', desc: '徐根宝指导创办的传奇青训基地，以严格管理和技术打磨著称，培养了武磊等球星。' },
            { name: '广州队青训', league: '中国青超联赛', tier: '大型青训', desc: '恒大足校体系，设施国际一流，但近年俱乐部动荡带来不确定性。' },
            { name: '浙江队青训', league: '中国青超联赛', tier: '新锐青训', desc: '近年崛起的高质量青训，注重传控和技术培养，青训理念先进。' },
        ];
        const OVERSEAS_ACADEMIES = [
            { name: '本菲卡青训学院（葡萄牙）', league: '葡萄牙青年联赛', tier: '欧洲顶级青训',
                desc: '世界闻名的青训圣地，培养出无数球星。对中国球员友好，有于大宝等先例。' },
            { name: '阿贾克斯青训营（荷兰）', league: '荷兰青年联赛', tier: '欧洲殿堂级青训',
            desc: '全攻全守的足球哲学，技术流的天堂。在这里你将接受最纯粹的足球教育。' },
        ];

        // 生成初始属性
        function generateInitialStats(position, talentBonus = 0) {
            const base = {
                PAC: { acc: 55 + Math.floor(Math.random() * 20) + talentBonus, sprint: 54 + Math.floor(Math.random() *
                        22) + talentBonus },
                SHO: { pos: 30 + Math.floor(Math.random() * 25) + talentBonus, fin: 28 + Math.floor(Math.random() * 28) +
                        talentBonus, shotPow: 35 + Math.floor(Math.random() * 25) + talentBonus, longShot: 25 + Math.floor(
                        Math.random() * 25) + talentBonus, volley: 20 + Math.floor(Math.random() * 20) + talentBonus,
                    pen: 35 + Math.floor(Math.random() * 25) + talentBonus },
                PAS: { vis: 30 + Math.floor(Math.random() * 30) + talentBonus, shortP: 40 + Math.floor(Math.random() * 30) +
                        talentBonus, longP: 28 + Math.floor(Math.random() * 28) + talentBonus, cross: 25 + Math.floor(Math
                        .random() * 30) + talentBonus, curve: 20 + Math.floor(Math.random() * 25) + talentBonus,
                    fkAcc: 20 + Math.floor(Math.random() * 25) + talentBonus },
                DRI: { agi: 45 + Math.floor(Math.random() * 25) + talentBonus, bal: 35 + Math.floor(Math.random() * 30) +
                        talentBonus, react: 38 + Math.floor(Math.random() * 28) + talentBonus, ballCtrl: 35 + Math.floor(
                        Math.random() * 30) + talentBonus, drib: 38 + Math.floor(Math.random() * 28) + talentBonus,
                    comp: 30 + Math.floor(Math.random() * 25) + talentBonus },
                DEF: { defAw: 15 + Math.floor(Math.random() * 20) + talentBonus, inter: 12 + Math.floor(Math.random() * 20) +
                        talentBonus, headAcc: 25 + Math.floor(Math.random() * 25) + talentBonus, standTack: 15 + Math.floor(
                        Math.random() * 20) + talentBonus, slideTack: 12 + Math.floor(Math.random() * 18) + talentBonus },
                PHY: { str: 30 + Math.floor(Math.random() * 25) + talentBonus, stam: 40 + Math.floor(Math.random() * 30) +
                        talentBonus, jump: 30 + Math.floor(Math.random() * 25) + talentBonus, agg: 30 + Math.floor(Math
                        .random() * 35) + talentBonus },
            };
            // 门将特殊处理
            if (position === 'GK') {
                base.GK = { reflexes: 40 + Math.floor(Math.random() * 30) + talentBonus, handling: 35 + Math.floor(Math
                        .random() * 30) + talentBonus, diving: 38 + Math.floor(Math.random() * 28) + talentBonus,
                    gkPos: 32 + Math.floor(Math.random() * 28) + talentBonus, kicking: 30 + Math.floor(Math.random() *
                        25) + talentBonus };
                base.DEF.headAcc = 20 + Math.floor(Math.random() * 15);
                base.DEF.standTack = 10 + Math.floor(Math.random() * 10);
            }
            return base;
        }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function calcOVR(stats, position) {
            let score = 0;
            if (position === 'GK') {
                const gk = stats.GK;
                score = (gk.reflexes * 0.3 + gk.handling * 0.2 + gk.diving * 0.2 + gk.gkPos * 0.2 + gk.kicking * 0.05 + stats
                    .PHY.str * 0.03 + stats.DRI.react * 0.02);
            } else if (['ST'].includes(position)) {
                score = (stats.SHO.pos * 0.18 + stats.SHO.fin * 0.18 + stats.DRI.comp * 0.12 + stats.PAC.acc * 0.10 + stats
                    .DRI.react * 0.10 + stats.PHY.str * 0.08 + stats.PHY.jump * 0.06 + stats.DRI.drib * 0.06 + stats.PAS
                    .shortP * 0.06 + stats.DRI.ballCtrl * 0.06);
            } else if (['LW', 'RW'].includes(position)) {
                score = (stats.PAC.acc * 0.16 + stats.DRI.agi * 0.14 + stats.DRI.bal * 0.10 + stats.DRI.drib * 0.12 + stats
                    .DRI.ballCtrl * 0.10 + stats.PAS.cross * 0.08 + stats.SHO.fin * 0.08 + stats.DRI.comp * 0.08 + stats.PAC
                    .sprint * 0.08 + stats.SHO.longShot * 0.06);
            } else if (['CAM'].includes(position)) {
                score = (stats.PAS.vis * 0.16 + stats.PAS.shortP * 0.14 + stats.DRI.comp * 0.12 + stats.DRI.react * 0.10 +
                    stats.SHO.longShot * 0.10 + stats.DRI.drib * 0.10 + stats.DRI.ballCtrl * 0.08 + stats.PAS.curve * 0.06 +
                    stats.PAC.acc * 0.06 + stats.SHO.fin * 0.08);
            } else if (['CM'].includes(position)) {
                score = (stats.PAS.shortP * 0.16 + stats.PAS.vis * 0.14 + stats.DRI.react * 0.10 + stats.DRI.comp * 0.10 +
                    stats.PAS.longP * 0.08 + stats.SHO.longShot * 0.08 + stats.DRI.ballCtrl * 0.08 + stats.PHY.stam * 0.10 +
                    stats.PAC.acc * 0.06 + stats.DEF.inter * 0.06 + stats.PHY.str * 0.04);
            } else if (['CDM'].includes(position)) {
                score = (stats.DEF.inter * 0.16 + stats.DEF.defAw * 0.14 + stats.PHY.str * 0.12 + stats.PHY.stam * 0.10 +
                    stats.PAS.shortP * 0.10 + stats.DEF.standTack * 0.10 + stats.PHY.agg * 0.08 + stats.DRI.react * 0.08 +
                    stats.PAS.vis * 0.06 + stats.DRI.comp * 0.06);
            } else if (['LB', 'RB'].includes(position)) {
                score = (stats.PAC.acc * 0.14 + stats.PAC.sprint * 0.10 + stats.PHY.stam * 0.12 + stats.DEF.standTack * 0.12 +
                    stats.DEF.inter * 0.10 + stats.PAS.cross * 0.10 + stats.DEF.defAw * 0.08 + stats.DRI.react * 0.08 +
                    stats.DRI.ballCtrl * 0.06 + stats.PAS.shortP * 0.06 + stats.PHY.str * 0.04);
            } else if (['CB'].includes(position)) {
                score = (stats.DEF.defAw * 0.18 + stats.DEF.inter * 0.14 + stats.PHY.str * 0.14 + stats.PHY.jump * 0.10 +
                    stats.DEF.standTack * 0.12 + stats.DRI.react * 0.08 + stats.PHY.agg * 0.06 + stats.DEF.headAcc * 0.08 +
                    stats.PAC.sprint * 0.04 + stats.PAS.shortP * 0.04 + stats.DRI.comp * 0.02);
            } else { score = 40; }
            return Math.round(clamp(score, 30, 99));
        }

        function calcMarketValue(ovr, age, potential) {
            let base = 50000;
            if (ovr >= 50) base = 150000;
            if (ovr >= 55) base = 400000;
            if (ovr >= 60) base = 1000000;
            if (ovr >= 65) base = 3000000;
            if (ovr >= 70) base = 8000000;
            if (ovr >= 75) base = 20000000;
            if (ovr >= 80) base = 45000000;
            if (ovr >= 85) base = 80000000;
            if (ovr >= 88) base = 120000000;
            if (ovr >= 90) base = 180000000;
            let ageFactor = 1.0;
            if (age < 18) ageFactor = 0.4 + (age - 15) * 0.2;
            if (age >= 18 && age <= 23) ageFactor = 0.7 + (age - 18) * 0.15;
            if (age >= 24 && age <= 28) ageFactor = 1.3;
            if (age >= 29 && age <= 32) ageFactor = 1.0 - (age - 29) * 0.12;
            if (age >= 33 && age <= 36) ageFactor = 0.5 - (age - 33) * 0.1;
            if (age > 36) ageFactor = 0.15;
            let potBonus = (potential - 50) / 50;
            let val = base * ageFactor * (1 + potBonus * 0.5);
            if (age < 18 && val > 80000000) val = 80000000;
            return Math.round(val / 10000) * 10000;
        }

        // ==================== 全局状态 ====================
        let player = null;
        let seasonYear = 2023;
        let seasonPhase = 0; // 0=赛季前, 1=赛季中, 2=赛季末, 3=转会窗
        let careerLog = [];
        let currentEvent = null;
        let totalSeasons = 0;
        let isCoachCareer = false;
        let coachData = null;

        function initPlayer(name, position, height, weight, foot, hometown, academyChoice, talentLevel) {
            const talentBonus = talentLevel === '天才' ? 12 : talentLevel === '优秀' ? 6 : talentLevel === '良好' ? 2 : -3;
            const stats = generateInitialStats(position, talentBonus);
            const ovr = calcOVR(stats, position);
            const potentialBase = talentLevel === '天才' ? 88 : talentLevel === '优秀' ? 82 : talentLevel === '良好' ? 76 :
            68;
            const potential = clamp(potentialBase + Math.floor(Math.random() * 6) - 2, 60, 92);
            player = {
                name,
                position,
                height,
                weight,
                foot,
                hometown,
                age: 16,
                birthYear: 2007,
                stats,
                ovr,
                potential,
                marketValue: calcMarketValue(ovr, 16, potential),
                club: academyChoice.name,
                league: academyChoice.league,
                clubType: 'academy',
                skillMoves: talentLevel === '天才' ? 3 : talentLevel === '优秀' ? 2 : 1,
                weakFoot: talentLevel === '天才' ? 4 : talentLevel === '优秀' ? 3 : 2,
                playStyles: [],
                morale: 75,
                fitness: 85,
                contractYears: 2,
                weeklyWage: 500,
                isRetired: false,
                nationalTeamCaps: 0,
                nationalTeamGoals: 0,
                careerGoals: 0,
                careerAssists: 0,
                careerApps: 0,
                seasonGoals: 0,
                seasonAssists: 0,
                seasonApps: 0,
                injuries: [],
                accolades: [],
            };
            if (talentLevel === '天才') player.playStyles.push('技术型盘带');
            if (position === 'ST' && talentLevel !== '平庸') player.playStyles.push('禁区猎手');
            seasonYear = 2023;
            totalSeasons = 0;
            careerLog = [];
            seasonPhase = 0;
            isCoachCareer = false;
            coachData = null;
            addLog(`🎉 ${name}（${ageDisplay()}）在${academyChoice.name}开始了他的足球生涯！位置：${position}，身高：${height}cm，天赋等级：${talentLevel}`);
            addLog(`📊 初始总评OVR：${player.ovr} | 预估潜力上限：${player.potential}`);
        }

        function ageDisplay() { return player ? `${player.age}岁` : ''; }

        function addLog(msg) {
            const now = new Date();
            const timeStr = `${seasonYear}-${String(now.getMonth()+1).padStart(2,'0')}`;
            careerLog.unshift({ time: timeStr, msg, season: totalSeasons });
            if (careerLog.length > 200) careerLog.length = 200;
        }

        function updateOVR() {
            if (!player || player.isRetired) return;
            player.ovr = calcOVR(player.stats, player.position);
            player.marketValue = calcMarketValue(player.ovr, player.age, player.potential);
            if (player.age < 18 && player.ovr > 80) {
                // 硬性限制
                const excess = player.ovr - 80;
                player.ovr = 80;
                // 微调属性
                const allStats = getAllStatKeys();
                for (let i = 0; i < excess * 2; i++) {
                    const randKey = allStats[Math.floor(Math.random() * allStats.length)];
                    if (typeof player.stats[randKey[0]][randKey[1]] === 'number' && player.stats[randKey[0]][randKey[1]] >
                        30) {
                        player.stats[randKey[0]][randKey[1]] = Math.max(25, player.stats[randKey[0]][randKey[1]] - 1);
                    }
                }
                player.ovr = calcOVR(player.stats, player.position);
                if (player.ovr > 80) player.ovr = 80;
            }
            if (player.age < 18 && player.marketValue > 80000000) player.marketValue = 80000000;
        }

        function getAllStatKeys() {
            const keys = [];
            for (const cat of ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY']) {
                if (player.stats[cat])
                    for (const k of Object.keys(player.stats[cat])) keys.push([cat, k]);
            }
            if (player.stats['GK'])
                for (const k of Object.keys(player.stats['GK'])) keys.push(['GK', k]);
            return keys;
        }

        function modifyStats(deltaMap) {
            if (!player || player.isRetired) return;
            for (const [cat, key, amount] of deltaMap) {
                if (player.stats[cat] && typeof player.stats[cat][key] === 'number') {
                    player.stats[cat][key] = clamp(player.stats[cat][key] + amount, 8, 99);
                }
            }
            updateOVR();
        }

        function agePlayer() {
            player.age += 1;
            seasonYear += 1;
            totalSeasons += 1;
            // 自然成长
            if (player.age <= 20) {
                const growth = player.potential > 80 ? 3 + Math.floor(Math.random() * 4) : 2 + Math.floor(Math.random() * 3);
                applyGrowth(growth);
            } else if (player.age <= 25) {
                const growth = player.ovr < player.potential ? 1 + Math.floor(Math.random() * 3) : Math.floor(Math.random() *
                    2);
                applyGrowth(growth);
            } else if (player.age <= 30) {
                if (Math.random() < 0.5) applyGrowth(1);
            } else if (player.age <= 34) {
                applyDecline(1 + Math.floor(Math.random() * 2));
            } else if (player.age <= 38) {
                applyDecline(2 + Math.floor(Math.random() * 3));
            } else {
                applyDecline(3 + Math.floor(Math.random() * 4));
            }
            updateOVR();
            player.seasonGoals = 0;
            player.seasonAssists = 0;
            player.seasonApps = 0;
        }

        function applyGrowth(count) {
            const allKeys = getAllStatKeys();
            for (let i = 0; i < count; i++) {
                const randKey = allKeys[Math.floor(Math.random() * allKeys.length)];
                if (player.stats[randKey[0]] && typeof player.stats[randKey[0]][randKey[1]] === 'number') {
                    player.stats[randKey[0]][randKey[1]] = clamp(player.stats[randKey[0]][randKey[1]] + 1, 8, 99);
                }
            }
        }

        function applyDecline(count) {
            const allKeys = getAllStatKeys();
            // 优先降低身体属性
            const physicalKeys = allKeys.filter(k => k[0] === 'PHY' || (k[0] === 'PAC'));
            const otherKeys = allKeys.filter(k => k[0] !== 'PHY' && k[0] !== 'PAC');
            for (let i = 0; i < count; i++) {
                const pool = i < Math.ceil(count * 0.6) ? physicalKeys.length ? physicalKeys : otherKeys : otherKeys.length ?
                    otherKeys : physicalKeys;
                const randKey = pool[Math.floor(Math.random() * pool.length)];
                if (player.stats[randKey[0]] && typeof player.stats[randKey[0]][randKey[1]] === 'number') {
                    player.stats[randKey[0]][randKey[1]] = clamp(player.stats[randKey[0]][randKey[1]] - 1, 6, 99);
                }
            }
        }

        // ==================== 事件系统 ====================
        function generateSeasonEvents() {
            if (!player || player.isRetired) return [];
            const events = [];
            const age = player.age;
            // 赛季前事件
            events.push({
                phase: 'preseason',
                title: '季前训练营',
                desc: `新的赛季即将开始。${player.club}的教练组公布了季前训练计划。你感觉自己状态${player.fitness>70?'不错':'一般'}，需要为赛季做好准备。`,
                choices: [
                    { text: '全力投入训练，每天加练1小时', effect: () => { modifyStats([['PHY','stam',2],['PHY','str',
                                1],['DRI','react',1]]);
                            player.fitness = clamp(player.fitness + 10, 40, 100);
                            player.morale = clamp(player.morale + 5, 20, 100);
                            addLog('🔥 你全力投入季前训练，体能和反应有所提升。'); } },
                    { text: '按部就班完成训练，注重恢复', effect: () => { player.fitness = clamp(player.fitness + 5, 40,
                            100);
                            player.morale = clamp(player.morale + 2, 20, 100);
                            addLog('✅ 你稳步完成训练，保持了良好的身体状态。'); } },
                    { text: '训练中尝试新位置/新技巧', effect: () => { modifyStats([['DRI','agi',1],['DRI','drib',1],
                            ['PAS','vis',1]]);
                            player.fitness = clamp(player.fitness + 3, 40, 100);
                            addLog('💡 你在训练中尝试了新的技术动作，盘带和视野有小幅提升。'); } },
                ]
            });
            // 赛季中事件 - 关键比赛
            events.push({
                phase: 'midseason',
                title: '关键比赛中的抉择',
                desc: `联赛进行到关键阶段，你在${player.club}迎来一场重要比赛。第75分钟，比分1-1，你获得了一个不错的机会...`,
                choices: [
                    { text: '果断射门！相信自己', effect: () => { if(Math.random()<0.55){ modifyStats([['SHO','fin',2],
                                ['DRI','comp',2]]);
                                player.seasonGoals+=1;
                                player.careerGoals+=1;
                                addLog('⚽ 你果断起脚射门得分！绝杀！射术和沉着度提升。'); } else { addLog(
                                '😔 射门偏出，但你在高压下的尝试值得肯定。');
                                player.morale = clamp(player.morale - 3, 20, 100); } } },
                    { text: '传给位置更好的队友', effect: () => { if(Math.random()<0.7){ modifyStats([['PAS','vis',2],
                                ['PAS','shortP',1]]);
                                player.seasonAssists+=1;
                                player.careerAssists+=1;
                                addLog('🎯 你送出精妙助攻，队友轻松破门！视野提升。'); } else { addLog(
                                '传球被拦截，但你的团队意识得到了教练的认可。'); } } },
                    { text: '尝试过掉防守球员再处理', effect: () => { if(Math.random()<0.45){ modifyStats([['DRI','drib',
                                2],['DRI','agi',1],['DRI','bal',1]]);
                                player.seasonGoals+=1;
                                player.careerGoals+=1;
                                addLog('🌟 你连过两人后推射得手！精彩的个人表演！盘带大幅提升。'); } else { addLog(
                                '😞 你被断球，对手反击...这次冒险没有成功。');
                                player.morale = clamp(player.morale - 5, 20, 100); } } },
                ]
            });
            // 人际关系事件
            events.push({
                phase: 'midseason',
                title: '更衣室风波',
                desc: `训练结束后，你听到队友在谈论你。有人觉得你太独，有人觉得你还不够自信。你注意到教练组也在观察你的反应...`,
                choices: [
                    { text: '主动找队友沟通，组织团建', effect: () => { player.morale = clamp(player.morale + 10,
                                20, 100);
                            modifyStats([['PAS','shortP',1],['DRI','comp',1]]);
                            addLog('🤝 你主动化解了更衣室紧张气氛，团队关系更加融洽，沉着度提升。'); } },
                    { text: '用训练表现说话，更加刻苦', effect: () => { modifyStats([['PHY','stam',2],['DRI','react',
                                2]]);
                            player.morale = clamp(player.morale + 3, 20, 100);
                            addLog('💪 你用汗水和努力回应了质疑，教练对你刮目相看。'); } },
                    { text: '不予理会，专注自己的比赛', effect: () => { player.morale = clamp(player.morale - 5, 20,
                            100);
                            modifyStats([['DRI','comp',1]]);
                            addLog('😐 你选择独善其身，但这让更衣室气氛有些微妙。'); } },
                ]
            });
            // 伤病风险事件
            if (Math.random() < 0.35) {
                events.push({
                    phase: 'midseason',
                    title: '身体警报',
                    desc: '最近赛程密集，你感到肌肉有些疲劳。训练师建议你休息一场，但下一场比赛很重要...',
                    choices: [
                        { text: '听从建议，轮休一场', effect: () => { player.fitness = clamp(player.fitness + 15,
                                40, 100);
                                addLog('🛌 你休息了一场，身体状态恢复良好。'); } },
                        { text: '咬牙坚持，带伤上阵', effect: () => { if(Math.random()<0.5){ player.fitness=clamp(
                                    player.fitness-20,20,100);
                                    player.morale=clamp(player.morale-8,20,100);
                                    addLog(
                                        '🤕 你坚持出场但表现不佳，还加重了疲劳。需要更长时间恢复。'); } else { modifyStats([
                                        ['PHY','stam',1],['DRI','comp',2]]);
                                    player.fitness=clamp(player.fitness-8,20,100);
                                    addLog('🔥 你带伤奋战，竟然踢出了赛季最佳表现！意志力令人敬佩。'); } } },
                    ]
                });
            }
            // 转会传闻（18岁后更频繁）
            if (player.age >= 17 && Math.random() < (player.age >= 18 ? 0.55 : 0.25)) {
                const interestedClubs = getInterestedClubs();
                if (interestedClubs.length > 0) {
                    const club = interestedClubs[Math.floor(Math.random() * interestedClubs.length)];
                    events.push({
                        phase: 'transfer',
                        title: '转会传闻',
                        desc: `有消息称${club}对${player.name}很感兴趣。球探已经多次来到${player.club}考察你的表现。`,
                        choices: [
                            { text: '表达兴趣，推动转会', effect: () => { player.morale = clamp(player.morale + 5,
                                    20, 100);
                                    addLog(`📰 ${player.name}对加盟${club}持开放态度，传闻愈演愈烈。`);
                                    attemptTransfer(club); } },
                            { text: '忠诚于现俱乐部，专注比赛', effect: () => { player.morale = clamp(player
                                    .morale + 2, 20, 100);
                                    modifyStats([['DRI','comp',1]]);
                                    addLog('🛡️ 你表达了对俱乐部的忠诚，球迷们更加喜爱你。'); } },
                            { text: '不表态，让经纪人处理', effect: () => { addLog(
                                    '🤐 你对转会传闻保持沉默，经纪人将处理一切。'); } },
                        ]
                    });
                }
            }
            // 国家队征召（高潜力球员）
            if (player.ovr >= 58 && player.age >= 18 && Math.random() < 0.3) {
                events.push({
                    phase: 'international',
                    title: '国字号征召',
                    desc: `中国U${player.age<=20?'20':'23'}国家队向你发出了征召！这是你第一次有机会穿上国家队战袍。`,
                    choices: [
                        { text: '欣然接受，这是梦想成真', effect: () => { player.nationalTeamCaps += 3;
                                player.morale = clamp(player.morale + 15, 20, 100);
                                modifyStats([['DRI','comp',2],['DRI','react',1]]);
                                addLog('🇨🇳 你代表中国队出场了！虽然只是青年队，但这是巨大的荣誉。'); } },
                        { text: '接受但保持谦虚，专注学习', effect: () => { player.nationalTeamCaps += 2;
                                player.morale = clamp(player.morale + 8, 20, 100);
                                modifyStats([['PAS','vis',1],['DRI','react',2]]);
                                addLog('🇨🇳 你在国家队训练营中学到了很多，视野有所开阔。'); } },
                    ]
                });
            }
            return events;
        }

        function getInterestedClubs() {
            const ovr = player.ovr;
            const clubs = [];
            if (ovr >= 48 && ovr < 58) clubs.push('上海申花', '北京国安', '武汉三镇', '成都蓉城');
            if (ovr >= 55 && ovr < 65) clubs.push('山东泰山', '上海海港', '浙江队', '天津津门虎');
            if (ovr >= 60 && ovr < 70) clubs.push('葡超-布拉加', '荷甲-费耶诺德', '比甲-布鲁日', '英冠-莱斯特城');
            if (ovr >= 65 && ovr < 75) clubs.push('葡超-本菲卡', '荷甲-阿贾克斯', '德甲-多特蒙德', '法甲-摩纳哥');
            if (ovr >= 70 && ovr < 78) clubs.push('英超-布莱顿', '德甲-勒沃库森', '意甲-那不勒斯', '西甲-皇家社会');
            if (ovr >= 75) clubs.push('英超-阿森纳', '英超-利物浦', '西甲-马德里竞技', '德甲-拜仁慕尼黑', '意甲-AC米兰');
            if (ovr >= 80) clubs.push('英超-曼城', '西甲-皇家马德里', '西甲-巴塞罗那', '法甲-巴黎圣日耳曼');
            return clubs.filter(() => Math.random() < 0.5);
        }

        function attemptTransfer(club) {
            const success = Math.random() < (player.ovr > 65 ? 0.5 : 0.35);
            if (success && player.age >= 18) {
                const oldClub = player.club;
                player.club = club;
                player.marketValue = Math.round(player.marketValue * (1 + Math.random() * 0.4));
                player.weeklyWage = Math.round(player.marketValue / 100000 * (200 + Math.random() * 300));
                addLog(`🔄 转会完成！${player.name}从${oldClub}加盟${club}！身价更新为€${(player.marketValue/1000000).toFixed(1)}M`);
                player.morale = clamp(player.morale + 10, 20, 100);
            } else if (success && player.age < 18) {
                addLog(`⏳ ${club}对${player.name}很感兴趣，但需要等到18岁才能完成正式转会。球探会持续关注。`);
            } else {
                addLog(`❌ 转会谈判破裂，${player.name}将继续留在${player.club}。`);
            }
        }

        // ==================== 赛季推进 ====================
        function advanceSeason() {
            if (!player || player.isRetired) return;
            agePlayer();
            player.seasonApps = 15 + Math.floor(Math.random() * 25);
            player.seasonGoals = Math.floor(Math.random() * (player.ovr > 70 ? 15 : player.ovr > 55 ? 8 : 3));
            player.seasonAssists = Math.floor(Math.random() * (player.ovr > 70 ? 10 : player.ovr > 55 ? 5 : 2));
            player.careerGoals += player.seasonGoals;
            player.careerAssists += player.seasonAssists;
            player.careerApps += player.seasonApps;
            addLog(
                `📅 ${seasonYear-1}-${seasonYear}赛季结束 | ${player.club} | 出场${player.seasonApps}次 | 进球${player.seasonGoals} | 助攻${player.seasonAssists} | OVR:${player.ovr} | 身价:€${(player.marketValue/1000000).toFixed(2)}M`
                );
            if (player.age >= 40 && !player.isRetired) {
                triggerRetirementChoice();
                return;
            }
            seasonPhase = 0;
            renderApp();
        }

        function triggerRetirementChoice() {
            currentEvent = {
                phase: 'retirement',
                title: '生涯十字路口',
                desc: `⚽ ${player.name}已经40岁了。经过${totalSeasons}个赛季的职业生涯，你站在了人生的十字路口。你的OVR现在是${player.ovr}，身价€${(player.marketValue/1000000).toFixed(2)}M。是时候做出选择了...`,
                choices: [
                    { text: '🏆 光荣退役，总结辉煌生涯', effect: () => { retirePlayer(); } },
                    { text: '📋 转战教练席，开启执教生涯', effect: () => { startCoachCareer(); } },
                    { text: '💪 继续征战！我还不想停下', effect: () => { player.age = 40;
                            player.morale = 80;
                            addLog('💪 你决定继续踢下去！老将的斗志永不熄灭。');
                            currentEvent = null;
                            advanceSeason(); } },
                ]
            };
            renderApp();
        }

        function retirePlayer() {
            player.isRetired = true;
            addLog(
                `🏆 ${player.name}宣布退役！职业生涯共${totalSeasons}个赛季，总出场${player.careerApps}次，打进${player.careerGoals}球，助攻${player.careerAssists}次。国家队出场${player.nationalTeamCaps}次，进${player.nationalTeamGoals}球。`);
            addLog(`📊 生涯最高OVR：${player.ovr} | 巅峰身价：€${(player.marketValue/1000000).toFixed(2)}M`);
            currentEvent = null;
            renderApp();
        }

        function startCoachCareer() {
            isCoachCareer = true;
            coachData = {
                club: '中乙-青岛红狮',
                league: '中国乙级联赛',
                reputation: 30,
                seasons: 0,
                trophies: 0,
                ovr: player.ovr,
            };
            addLog(`📋 ${player.name}挂靴后转战教练席，从${coachData.club}开始了执教生涯！`);
            player.isRetired = true;
            currentEvent = null;
            renderApp();
        }

        function advanceCoachSeason() {
            if (!isCoachCareer || !coachData) return;
            coachData.seasons += 1;
            const perf = Math.random();
            if (perf > 0.7) {
                coachData.reputation += 8 + Math.floor(Math.random() * 7);
                coachData.trophies += Math.random() < 0.3 ? 1 : 0;
                addLog(`🏆 执教${coachData.club}赛季成功！声誉提升至${coachData.reputation}`);
                if (coachData.reputation > 50 && coachData.club.includes('中乙')) {
                    coachData.club = '中甲-石家庄功夫';
                    coachData.league = '中国甲级联赛';
                    addLog('📈 你获得了中甲球队的执教邀请！');
                }
                if (coachData.reputation > 70 && coachData.club.includes('中甲')) {
                    coachData.club = '中超-天津津门虎';
                    coachData.league = '中国超级联赛';
                    addLog('🚀 你成为了中超球队的主教练！');
                }
                if (coachData.reputation > 85) {
                    const bigClubs = ['英超-埃弗顿', '德甲-法兰克福', '葡超-波尔图', '荷甲-埃因霍温'];
                    coachData.club = bigClubs[Math.floor(Math.random() * bigClubs.length)];
                    coachData.league = '欧洲顶级联赛';
                    addLog('🌍 你的执教能力获得了欧洲足坛的认可！');
                }
            } else if (perf > 0.35) {
                coachData.reputation += 2 + Math.floor(Math.random() * 4);
                addLog(`📊 执教${coachData.club}赛季平稳度过，声誉微升至${coachData.reputation}`);
            } else {
                coachData.reputation = Math.max(10, coachData.reputation - 3 - Math.floor(Math.random() * 5));
                addLog(`😔 本赛季战绩不佳，声誉降至${coachData.reputation}`);
            }
            renderApp();
        }

        // ==================== UI渲染 ====================
        function renderApp() {
            const app = document.getElementById('app');
            if (!player) {
                app.innerHTML = renderCreationForm();
                return;
            }
            if (player.isRetired && isCoachCareer) {
                app.innerHTML = renderCoachUI();
                return;
            }
            if (player.isRetired && !isCoachCareer) {
                app.innerHTML = renderRetirementUI();
                return;
            }
            if (currentEvent) {
                app.innerHTML = renderEventUI();
                return;
            }
            app.innerHTML = renderMainUI();
        }

        function renderCreationForm() {
            return `
            <div class="panel">
                <h3>🆕 创建你的球员</h3>
                <p style="color:#8b949e;">2007年出生 · 16岁 · 中国籍 · 职业生涯即将开始</p>
                <div class="grid2">
                    <div><label>姓名</label><input id="pname" placeholder="输入球员姓名" value="林奕辰"></div>
                    <div><label>家乡</label><input id="phometown" placeholder="如：辽宁大连" value="山东青岛"></div>
                    <div><label>身高(cm)</label><input id="pheight" type="number" value="178" min="155" max="205"></div>
                    <div><label>体重(kg)</label><input id="pweight" type="number" value="68" min="45" max="110"></div>
                    <div><label>位置</label><select id="ppos">${POSITIONS.map(p=>`<option value="${p}" ${p==='CAM'?'selected':''}>${p}</option>`).join('')}</select></div>
                    <div><label>惯用脚</label><select id="pfoot"><option>右脚</option><option>左脚</option><option>双足</option></select></div>
                    <div><label>青训地点</label><select id="pacademy">
                        <optgroup label="🇨🇳 中国青训">
                            ${CHINA_ACADEMIES.map(a=>`<option value="${a.name}">${a.name} - ${a.tier}</option>`).join('')}
                        </optgroup>
                        <optgroup label="🌍 海外青训">
                            ${OVERSEAS_ACADEMIES.map(a=>`<option value="${a.name}">${a.name} - ${a.tier}</option>`).join('')}
                        </optgroup>
                    </select></div>
                    <div><label>天赋等级</label><select id="ptalent">
                        <option value="天才">🌟 天才 (潜力极高，初始属性好)</option>
                        <option value="优秀" selected>⭐ 优秀 (潜力良好，发展稳定)</option>
                        <option value="良好">👍 良好 (中规中矩，需要努力)</option>
                        <option value="平庸">📉 平庸 (起点较低，逆袭之路)</option>
                    </select></div>
                </div>
                <div style="margin-top:12px;font-size:0.8em;color:#8b949e;">
                    📌 提示：18岁前OVR上限80，身价上限€8000万。40岁时可选择退役或转教练。
                </div>
                <button class="btn primary" style="width:100%;margin-top:12px;font-size:1.1em;" onclick="startGame()">⚽ 开始职业生涯</button>
            </div>`;
        }

        function startGame() {
            const name = document.getElementById('pname').value.trim() || '无名球员';
            const hometown = document.getElementById('phometown').value.trim() || '中国';
            const height = parseInt(document.getElementById('pheight').value) || 178;
            const weight = parseInt(document.getElementById('pweight').value) || 68;
            const position = document.getElementById('ppos').value;
            const foot = document.getElementById('pfoot').value;
            const academyName = document.getElementById('pacademy').value;
            const talent = document.getElementById('ptalent').value;
            const allAcademies = [...CHINA_ACADEMIES, ...OVERSEAS_ACADEMIES];
            const academyChoice = allAcademies.find(a => a.name === academyName) || CHINA_ACADEMIES[0];
            initPlayer(name, position, height, weight, foot, hometown, academyChoice, talent);
            renderApp();
        }

        function renderMainUI() {
            const p = player;
            const ovrColor = p.ovr >= 80 ? '#ffd97a' : p.ovr >= 70 ? '#3fb950' : p.ovr >= 55 ? '#58a6ff' : '#8b949e';
            return `
            <div class="grid2">
                <div class="panel">
                    <h3>👤 ${p.name} | ${ageDisplay()} | ${p.position}</h3>
                    <div class="flex-center">
                        <div class="ovr-circle" style="border-color:${ovrColor};color:${ovrColor};">${p.ovr}</div>
                        <div>
                            <span class="value-tag">€${(p.marketValue/1000000).toFixed(2)}M</span>
                            <br><span style="font-size:0.8em;">${p.club}</span>
                        </div>
                    </div>
                    <div style="margin-top:6px;">
                        <span class="tag tag-info">潜力${p.potential}</span>
                        <span class="tag tag-gold">花式${'⭐'.repeat(p.skillMoves)}</span>
                        <span class="tag tag-gold">逆足${'⭐'.repeat(p.weakFoot)}</span>
                        ${p.playStyles.map(s=>`<span class="tag tag-up">${s}</span>`).join('')}
                    </div>
                    <div style="margin-top:8px;font-size:0.8em;">
                        身高${p.height}cm | 体重${p.weight}kg | ${p.foot} | ${p.hometown}<br>
                        国家队出场${p.nationalTeamCaps}次 | 生涯进球${p.careerGoals} | 助攻${p.careerAssists}<br>
                        周薪€${p.weeklyWage} | 合同${p.contractYears}年 | 士气${p.morale}/100
                    </div>
                </div>
                <div class="panel">
                    <h3>📊 详细属性</h3>
                    ${renderStatCategory('🏃 速度 PAC', p.stats.PAC, ['acc','加速','sprint','冲刺'])}
                    ${renderStatCategory('🎯 射门 SHO', p.stats.SHO, ['pos','站位','fin','射术','shotPow','力量','longShot','远射'])}
                    ${renderStatCategory('📨 传球 PAS', p.stats.PAS, ['vis','视野','shortP','短传','longP','长传','cross','传中'])}
                    ${renderStatCategory('🦶 盘带 DRI', p.stats.DRI, ['agi','敏捷','bal','平衡','react','反应','drib','盘带','comp','沉着'])}
                    ${renderStatCategory('🛡️ 防守 DEF', p.stats.DEF, ['defAw','意识','inter','拦截','standTack','抢断','headAcc','头球'])}
                    ${renderStatCategory('💪 身体 PHY', p.stats.PHY, ['str','力量','stam','耐力','jump','跳跃','agg','侵略'])}
                    ${p.stats.GK ? renderStatCategory('🧤 门将 GK', p.stats.GK, ['reflexes','反应','handling','接球','diving','鱼跃','gkPos','站位']) : ''}
                </div>
            </div>
            <div class="panel">
                <h3>📅 ${seasonYear}-${seasonYear+1}赛季 | ${p.club} | 阶段：${['季前','赛季中','赛季末','转会窗'][seasonPhase]}</h3>
                <p style="font-size:0.85em;">本赛季数据：出场${p.seasonApps} | 进球${p.seasonGoals} | 助攻${p.seasonAssists}</p>
                <div class="btn-group">
                    ${seasonPhase===0 ? `<button class="btn primary" onclick="startSeasonEvents()">🏃 进入赛季训练 & 事件</button>` : ''}
                    ${seasonPhase===1 ? `<button class="btn" onclick="startSeasonEvents()">📋 处理赛季中事件</button>` : ''}
                    ${seasonPhase===2 ? `<button class="btn primary" onclick="advanceSeason()">📅 结束赛季 & 进入下一年</button>` : ''}
                    ${seasonPhase===3 ? `<button class="btn gold" onclick="handleTransferWindow()">🔄 转会窗口操作</button>` : ''}
                    <button class="btn" onclick="seasonPhase=(seasonPhase+1)%4;renderApp();">⏭️ 切换阶段</button>
                </div>
                <p style="font-size:0.75em;color:#8b949e;">提示：切换阶段来体验季前训练→赛季事件→赛季结束→转会窗的完整循环。赛季中可触发随机事件。</p>
            </div>
            <div class="panel">
                <h3>📜 生涯记录</h3>
                <div class="career-log">
                    ${careerLog.slice(0,30).map(e=>`<div class="entry"><span style="color:#58a6ff;">${e.time}</span> ${e.msg}</div>`).join('')}
                    ${careerLog.length===0?'<p style="color:#8b949e;">生涯刚刚开始...</p>':''}
                </div>
            </div>`;
        }

        function renderStatCategory(title, stats, keys) {
            if (!stats) return '';
            let html = `<div style="font-size:0.78em;margin:2px 0;"><strong>${title}</strong></div>`;
            for (let i = 0; i < keys.length; i += 2) {
                const key = keys[i];
                const label = keys[i + 1];
                const val = stats[key] || 0;
                const pct = Math.min(100, val);
                const color = val >= 80 ? '#ffd97a' : val >= 65 ? '#3fb950' : val >= 45 ? '#58a6ff' : '#8b949e';
                html +=
                    `<div class="stat-row"><span>${label}</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div><span class="stat-val" style="color:${color};">${val}</span></div>`;
            }
            return html;
        }

        function renderEventUI() {
            const ev = currentEvent;
            return `
            <div class="panel">
                <h3>⚡ ${ev.title}</h3>
                <div class="event-narrative">
                    <span class="date-tag">${seasonYear}年 | ${ageDisplay()}</span>
                    <p>${ev.desc}</p>
                </div>
                <h4 style="margin-top:12px;">你的选择：</h4>
                <div class="btn-group">
                    ${ev.choices.map((c,i)=>`<button class="btn ${i===0?'primary':''}" onclick="makeChoice(${i})">${c.text}</button>`).join('')}
                </div>
            </div>`;
        }

        function makeChoice(index) {
            if (!currentEvent || !currentEvent.choices[index]) return;
            currentEvent.choices[index].effect();
            currentEvent = null;
            if (player && !player.isRetired && seasonPhase < 2) seasonPhase = Math.min(2, seasonPhase + 1);
            renderApp();
        }

        function startSeasonEvents() {
            if (!player || player.isRetired) return;
            const events = generateSeasonEvents();
            if (events.length > 0) {
                currentEvent = events[Math.floor(Math.random() * events.length)];
                seasonPhase = 1;
            } else {
                addLog('📋 当前阶段没有特别的事件，平稳度过。');
                seasonPhase = Math.min(2, seasonPhase + 1);
            }
            renderApp();
        }

        function handleTransferWindow() {
            if (!player || player.isRetired) return;
            seasonPhase = 3;
            const clubs = getInterestedClubs();
            if (clubs.length > 0 && player.age >= 18) {
                const club = clubs[Math.floor(Math.random() * clubs.length)];
                currentEvent = {
                    phase: 'transfer',
                    title: '转会窗口开启',
                    desc: `转会窗口已经打开。${club}等俱乐部对${player.name}表示了兴趣。你目前效力于${player.club}，身价€${(player.marketValue/1000000).toFixed(2)}M。`,
                    choices: [
                        { text: `推动转会到${club}`, effect: () => { attemptTransfer(club);
                                seasonPhase = 0;
                                currentEvent = null;
                                renderApp(); } },
                        { text: '留在现俱乐部，续约谈判', effect: () => { player.contractYears += 2;
                                player.weeklyWage = Math.round(player.weeklyWage * 1.3);
                                addLog('📝 你与俱乐部续约，合同延长，周薪上涨。');
                                seasonPhase = 0;
                                currentEvent = null;
                                renderApp(); } },
                        { text: '暂不决定，观望市场', effect: () => { addLog('👀 你选择观望，等待更好的机会。');
                                seasonPhase = 0;
                                currentEvent = null;
                                renderApp(); } },
                    ]
                };
                renderApp();
            } else {
                addLog('📭 这个转会窗口没有合适的报价，继续专注比赛。');
                seasonPhase = 0;
                renderApp();
            }
        }

        function renderRetirementUI() {
            const p = player;
            return `
            <div class="panel" style="text-align:center;">
                <h2>🏆 传奇落幕</h2>
                <div style="font-size:3em;">⚽</div>
                <h3>${p.name} | ${p.position} | 退役时${p.age}岁</h3>
                <div class="ovr-circle" style="margin:10px auto;">${p.ovr}</div>
                <div class="highlight-box">
                    <p><strong>职业生涯总结</strong></p>
                    <p>📅 ${totalSeasons}个赛季 | 🏟️ 总出场${p.careerApps}次</p>
                    <p>⚽ 总进球${p.careerGoals} | 🎯 总助攻${p.careerAssists}</p>
                    <p>🇨🇳 国家队出场${p.nationalTeamCaps}次 | 国家队进球${p.nationalTeamGoals}</p>
                    <p>💰 巅峰身价：€${(p.marketValue/1000000).toFixed(2)}M | 📊 最高OVR：${p.ovr}</p>
                    <p>🏅 效力过的俱乐部：${p.club}</p>
                </div>
                <h3 style="margin-top:16px;">生涯荣誉</h3>
                <div class="career-log" style="max-height:200px;">
                    ${careerLog.filter(e=>e.msg.includes('🏆')||e.msg.includes('冠军')||e.msg.includes('⚽')||e.msg.includes('转会')).slice(0,20).map(e=>`<div class="entry">${e.msg}</div>`).join('')}
                </div>
                <p style="margin-top:12px;color:#8b949e;">感谢你为中国足球做出的贡献！</p>
                <button class="btn primary" onclick="location.reload()">🔄 重新开始新生涯</button>
            </div>`;
        }

        function renderCoachUI() {
            const cd = coachData;
            return `
            <div class="panel" style="text-align:center;">
                <h2>📋 教练生涯</h2>
                <h3>${player.name} | 执教第${cd.seasons}年</h3>
                <div class="highlight-box">
                    <p>🏟️ 执教球队：<strong>${cd.club}</strong></p>
                    <p>📊 联赛：${cd.league}</p>
                    <p>⭐ 教练声誉：${cd.reputation}/100</p>
                    <p>🏆 执教奖杯：${cd.trophies}座</p>
                </div>
                <div class="btn-group">
                    <button class="btn primary" onclick="advanceCoachSeason()">📅 模拟下一个赛季</button>
                    <button class="btn danger" onclick="location.reload()">🔄 结束模拟</button>
                </div>
                <div class="career-log" style="max-height:200px;margin-top:12px;">
                    ${careerLog.filter(e=>e.msg.includes('教练')||e.msg.includes('执教')||e.msg.includes('中乙')||e.msg.includes('中甲')||e.msg.includes('中超')||e.msg.includes('欧洲')).slice(0,15).map(e=>`<div class="entry">${e.msg}</div>`).join('')}
                </div>
            </div>`;
        }

        // ==================== 初始化 ====================
        function init() {
            player = null;
            currentEvent = null;
            seasonYear = 2023;
            seasonPhase = 0;
            careerLog = [];
            totalSeasons = 0;
            isCoachCareer = false;
            coachData = null;
            renderApp();
        }

        // 暴露到全局作用域
        window.startGame = startGame;
        window.makeChoice = makeChoice;
        window.startSeasonEvents = startSeasonEvents;
        window.advanceSeason = advanceSeason;
        window.handleTransferWindow = handleTransferWindow;
        window.advanceCoachSeason = advanceCoachSeason;
        window.seasonPhase = seasonPhase;
        Object.defineProperty(window, 'seasonPhase', {
            get: () => seasonPhase,
            set: (v) => { seasonPhase = v;
                renderApp(); }
        });

        init();
        console.log('⚽ 足球生涯模拟器已就绪！');
        console.log('📌 提示：切换赛季阶段来体验完整循环：季前→赛季中→赛季末→转会窗');
        console.log('📌 40岁时将触发退役/转教练选择');
        console.log('📌 18岁前OVR≤80，身价≤€8000万');
    </script>
</body>
</html>
